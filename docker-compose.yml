services:
  postgres:
    image: postgres:16
    container_name: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/01-create-databases.sql:/docker-entrypoint-initdb.d/01-create-databases.sql   
    networks:
      - micronw

  auth-service:
    build: ./auth-service
    image: kartikeyasoft/auth-service:latest
    container_name: auth-service

    environment:
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/auth_db
      SPRING_DATASOURCE_USERNAME: appuser
      SPRING_DATASOURCE_PASSWORD: App@12345
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    ports:
      - "8080:8080"
    depends_on:
      - postgres
    networks:
      - micronw

  user-service:
    build: ./user-service
    image: kartikeyasoft/user-service:latest
    container_name: user-service

    environment:
      SERVER_PORT: 8081
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/user_db
      SPRING_DATASOURCE_USERNAME: appuser
      SPRING_DATASOURCE_PASSWORD: App@12345
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    ports:
      - "8081:8081"
    depends_on:
      - postgres
    networks:
      - micronw

  item-service:
    build: ./item-service
    image: kartikeyasoft/item-service:latest
    container_name: item-service

    environment:
      SERVER_PORT: 8082
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/item_db
      SPRING_DATASOURCE_USERNAME: appuser
      SPRING_DATASOURCE_PASSWORD: App@12345
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    ports:
      - "8082:8082"
    depends_on:
      - postgres
    networks:
      - micronw

  frontend:
    build: ./frontend
    image: kartikeyasoft/frontend:latest
    container_name: frontend
    ports:
      - "80:80"
    depends_on:
      - auth-service
      - user-service
      - item-service
    networks:
      - micronw

volumes:
    postgres_data:
     
networks:
  micronw :
    driver: bridge



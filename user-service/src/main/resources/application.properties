spring.application.name=user-service
server.port=8081
spring.datasource.url=$(SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/user_db)
spring.datasource.username=$(SPRING_DATASOURCE_USERNAME:appuser)
spring.datasource.password=$(SPRING_DATASOURCE_PASSWORD:App@12345)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

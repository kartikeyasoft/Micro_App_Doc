<!doctype html>
<html><head><meta charset="utf-8"><title>KartikeyaSoft Microservices Lab</title>
<link rel="stylesheet" href="/css/style.css"></head>
<body><main class="container">
<h1>KartikeyaSoft Microservices Lab</h1>
<p>NGINX → Auth / User / Item → PostgreSQL</p>

<section><h2>Authentication</h2>
<input id="username" placeholder="Username"><input id="email" placeholder="Email">
<input id="password" type="password" placeholder="Password">
<button onclick="register()">Register</button><button onclick="login()">Login</button>
<pre id="authResult"></pre></section>

<section><h2>User Profile</h2>
<input id="userId" type="number" placeholder="Auth User ID">
<input id="firstName" placeholder="First name"><input id="lastName" placeholder="Last name">
<input id="phone" placeholder="Phone"><input id="address" placeholder="Address">
<button onclick="createUser()">Create</button><button onclick="loadUsers()">List</button>
<pre id="userResult"></pre></section>

<section><h2>Items</h2>
<input id="itemName" placeholder="Name"><input id="itemDescription" placeholder="Description">
<input id="itemPrice" type="number" placeholder="Price"><input id="itemQuantity" type="number" placeholder="Quantity">
<button onclick="createItem()">Add</button><button onclick="loadItems()">List</button>
<pre id="itemResult"></pre></section>
</main><script src="/js/app.js"></script></body></html>
